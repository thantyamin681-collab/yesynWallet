<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wallet History | YeSync</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #1c2e1a; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px;
        }
        /* 💡 GLOBAL DARK MODE STYLES FOR DASHBOARD */
        body.dark-mode {
            background: #121212 !important; color: #ffffff !important;
        }
        .history-container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header-area { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
        
        .home-btn {
            background: #e1f5fe; color: #0288d1; border: none; padding: 12px; border-radius: 50%;
            cursor: pointer; font-size: 20px; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        body.dark-mode .home-btn { background: #222 !important; color: #00bcff !important; }

        .title-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 15px 30px;
            border-radius: 15px; border-left: 5px solid #76ba1b; flex-grow: 1;
        }
        body.dark-mode .title-box { border-left: 5px solid #00bcff !important; background: rgba(30,30,30,0.8) !important; }
        .title-box h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }

        /* 📊 TABLE STYLES */
        .table-header {
            display: grid; grid-template-columns: 1fr 2fr 1fr; padding: 10px 25px;
            color: #bfff00; font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 15px;
        }
        /* 🔵 FIX: Dark Mode ပြောင်းပါက Date, Description, Amount ကို အပြာရောင် သို့ ပြောင်းပေးခြင်း */
        body.dark-mode .table-header {
            color: #00bcff !important;
        }

        .table-body { display: flex; flex-direction: column; gap: 14px; }
        .table-row {
            display: grid; grid-template-columns: 1fr 2fr 1fr; background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px; padding: 20px 25px; text-align: center; align-items: center; font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s;
        }
        body.dark-mode .table-row {
            background: rgba(30, 30, 30, 0.6) !important; border: 1px solid rgba(255, 255, 255, 0.08) !important;
        }
        .table-row:hover { transform: translateY(-2px); }
        .income-text { color: #81C784; font-weight: bold; }
        .outcome-text { color: #E57373; font-weight: bold; }
    </style>
</head>
<body>

<div class="history-container">
    <div class="header-area">
        <button class="home-btn" onclick="location.href='/dashboard'"><i class="fa-solid fa-house"></i></button>
        <div class="title-box">
            <h1 data-i18n="wallet-history-title">Wallet History</h1>
        </div>
    </div>

    <div class="table-header">
        <div data-i18n="th-date">Date</div>
        <div data-i18n="th-desc">Description</div>
        <div data-i18n="th-amount">Amount</div>
    </div>

    <div class="table-body" id="historyTableBody">
        <!-- API Data Will Load Here -->
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
    } else {
        document.body.classList.remove('dark-mode');
    }
    // ကွက်တိ ဘာသာစကားပြောင်းလဲမှု အပိုင်း
    const currentLang = localStorage.getItem('language') || 'en';
    const trans = {
        en: { "wallet-history-title": "Wallet History", "th-date": "Date", "th-desc": "Description", "th-amount": "Amount" },
        mm: { "wallet-history-title": "ငွေလွှဲမှတ်တမ်း", "th-date": "ရက်စွဲ", "th-desc": "အကြောင်းအရာ", "th-amount": "ပမာဏငွေ" }
    };
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (trans[currentLang] && trans[currentLang][key]) el.innerText = trans[currentLang][key];
    });
});
</script>
</body>
</html>
